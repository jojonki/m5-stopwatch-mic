[package]
name = "swmic-bridge"
version = "0.2.3"
edition = "2021"
description = "Tray app bridging the BLE StopWatch mic to a virtual audio device and a trigger key"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures = "0.3"
uuid = "1"
serde_json = "1"
png = "0.17"
cpal = "0.15"
tray-icon = "0.19"
tao = "0.30"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
